[package]
name = "mlang"
version = "0.1.0"
edition = "2021"
default-run = "mlang"

[[bin]]
name = "mlang"
path = "src/main.rs"

[[bin]]
name = "mlang-lsp"
path = "src/lsp/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
ropey = "1"
inkwell = { version = "0.8", features = ["llvm14-0"], optional = true }
llvm-sys = { version = "140", optional = true }

[features]
default = []
llvm-backend = ["inkwell", "llvm-sys"]
